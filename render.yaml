services:
  - type: web
    name: axis-main
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60 --max-requests 500 --max-requests-jitter 50
    healthCheckPath: /healthz
    envVars:
      - key: WEBSITE2_URL
        sync: false
      - key: WEBSITE3_URL
        sync: false
      - key: MISSION1_CODE
        sync: false
      - key: MISSION2_CODE
        sync: false
      - key: MISSION3_CODE
        sync: false
      - key: MISSION5_CODE
        sync: false
      - key: MISSION4_CODE
        sync: false
      - key: FINAL_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PANITIA_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GROUP_CODES
        sync: false
